services:
  # ── Frontend ────────────────────────────────────────────────────────────────
  quikly-frontend:
    build:
      context: ./quikly-frontend
      dockerfile: Dockerfile
      target: runtime
    image: quikly-frontend:latest
    container_name: quikly-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      quikly-backend:
        condition: service_healthy
    networks:
      - quikly-net

  # ── Backend ─────────────────────────────────────────────────────────────────
  quikly-backend:
    build:
      context: ./quikly-backend
      dockerfile: Dockerfile
      target: runtime
    image: quikly-backend:latest
    container_name: quikly-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    env_file:
      - ./quikly-backend/.env
    environment:
      PORT: "${BACKEND_PORT:-3000}"
      NODE_ENV: "${NODE_ENV:-production}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
      REDIS_PASS: ""
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - quikly-net

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: quikly-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - quikly-net

volumes:
  redis-data:

networks:
  quikly-net:
    driver: bridge
