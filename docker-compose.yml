services:
  # ── Frontend ────────────────────────────────────────────────────────────────
  quikly-frontend:
    build:
      context: ./quikly-frontend
      dockerfile: Dockerfile
      target: runtime
    image: quikly-frontend:latest
    container_name: quikly-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      quikly-backend:
        condition: service_healthy
    networks:
      - quikly-net

  # ── Backend ─────────────────────────────────────────────────────────────────
  quikly-backend:
    build:
      context: ./quikly-backend
      dockerfile: Dockerfile
      target: runtime
    image: quikly-backend:latest
    container_name: quikly-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      PORT: "${BACKEND_PORT:-3000}"
      NODE_ENV: "${NODE_ENV:-production}"
      DATABASE_URL: "${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/quikly?sslmode=disable}"
      BASE_URL: "${BASE_URL:-http://localhost:5173}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
      REDIS_PASS: "${REDIS_PASS:-}"
      APP_DOMAIN: "${APP_DOMAIN:-http://localhost:5173}"
      RATE_LIMIT_CAPACITY: "${RATE_LIMIT_CAPACITY:-100}"
      RATE_LIMIT_REFILL_RATE: "${RATE_LIMIT_REFILL_RATE:-10}"
      RATE_LIMIT_WINDOW_SEC: "${RATE_LIMIT_WINDOW_SEC:-3600}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - quikly-net

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: quikly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: quikly
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quikly"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - quikly-net

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: quikly-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - quikly-net

volumes:
  postgres-data:
  redis-data:

networks:
  quikly-net:
    driver: bridge
